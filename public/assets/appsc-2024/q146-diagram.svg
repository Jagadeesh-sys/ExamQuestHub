<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 290" width="320" height="290">
  <rect width="320" height="290" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>
  <g stroke="#0F172A" stroke-width="2.5" fill="none" stroke-linejoin="round">
    <!-- Small top square around apex -->
    <rect x="130" y="34" width="60" height="54"/>
    <!-- Large 2x2 square below -->
    <rect x="85" y="88" width="150" height="162"/>
    <!-- Vertical center line through apex down to base -->
    <line x1="160" y1="45" x2="160" y2="250"/>
    <!-- Horizontal center line of 2x2 square -->
    <line x1="85" y1="169" x2="235" y2="169"/>
    <!-- Inscribed tilted square (diamond) -->
    <polygon points="160,124 205,169 160,214 115,169"/>
    <!-- Large outer triangle passing through (130,88)->(85,169)->(34,250) on left and symmetrically on right -->
    <polygon points="160,45 34,250 286,250"/>
  </g>
</svg>
