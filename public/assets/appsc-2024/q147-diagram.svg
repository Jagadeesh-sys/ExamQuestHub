<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 160" width="640" height="160">
  <rect width="640" height="160" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>
  <text x="68" y="24" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#1E293B">Question Figure</text>
  <text x="392" y="24" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#1E293B">Answer Figures</text>

  <!-- Question Figure -->
  <g transform="translate(20, 34)">
    <rect x="0" y="0" width="96" height="96" fill="#FFFFFF" stroke="#0F172A" stroke-width="2"/>
    <rect x="10" y="10" width="76" height="76" fill="#FFFFFF" stroke="#0F172A" stroke-width="2"/>
    <!-- Top inverted black triangle -->
    <polygon points="16,10 80,10 48,38" fill="#0F172A"/>
    <!-- Left outer V / M diagonal and lower-left nested triangle -->
    <line x1="10" y1="10" x2="86" y2="86" stroke="#0F172A" stroke-width="2"/>
    <line x1="48" y1="38" x2="86" y2="10" stroke="#0F172A" stroke-width="2"/>
    <polygon points="18,32 18,78 64,78" fill="none" stroke="#0F172A" stroke-width="2.2"/>
    <polygon points="86,28 86,86 58,58" fill="#0F172A"/>
    <line x1="58" y1="42" x2="86" y2="16" stroke="#0F172A" stroke-width="2"/>
    <polygon points="72,62 72,86 84,86" fill="#0F172A"/>
  </g>

  <!-- Answer Figure (1) -->
  <g transform="translate(155, 34)">
    <rect x="0" y="0" width="96" height="96" fill="#FFFFFF" stroke="#0F172A" stroke-width="2"/>
    <rect x="10" y="10" width="76" height="76" fill="none" stroke="#64748B" stroke-width="1"/>
    <polyline points="20,76 20,24 48,50 76,24 76,76" fill="none" stroke="#0F172A" stroke-width="2.5" stroke-linejoin="round"/>
    <text x="48" y="116" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#0F172A">(1)</text>
  </g>

  <!-- Answer Figure (2) -->
  <g transform="translate(272, 34)">
    <rect x="0" y="0" width="96" height="96" fill="#FFFFFF" stroke="#0F172A" stroke-width="2"/>
    <rect x="10" y="10" width="76" height="76" fill="none" stroke="#64748B" stroke-width="1"/>
    <line x1="28" y1="22" x2="28" y2="74" stroke="#0F172A" stroke-width="2.5"/>
    <polygon points="28,48 68,26 68,70" fill="none" stroke="#0F172A" stroke-width="2.5"/>
    <text x="48" y="116" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#0F172A">(2)</text>
  </g>

  <!-- Answer Figure (3) -->
  <g transform="translate(389, 34)">
    <rect x="0" y="0" width="96" height="96" fill="#FFFFFF" stroke="#0F172A" stroke-width="2"/>
    <rect x="10" y="10" width="76" height="76" fill="none" stroke="#64748B" stroke-width="1"/>
    <line x1="20" y1="22" x2="20" y2="76" stroke="#0F172A" stroke-width="2.5"/>
    <line x1="20" y1="76" x2="78" y2="22" stroke="#0F172A" stroke-width="2.5"/>
    <line x1="78" y1="22" x2="78" y2="76" stroke="#0F172A" stroke-width="2.5"/>
    <line x1="50" y1="48" x2="78" y2="76" stroke="#0F172A" stroke-width="2.5"/>
    <text x="48" y="116" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#0F172A">(3)</text>
  </g>

  <!-- Answer Figure (4) -->
  <g transform="translate(506, 34)">
    <rect x="0" y="0" width="96" height="96" fill="#FFFFFF" stroke="#0F172A" stroke-width="2"/>
    <rect x="10" y="10" width="76" height="76" fill="none" stroke="#64748B" stroke-width="1"/>
    <polygon points="24,22 72,22 48,48" fill="#0F172A" stroke="#0F172A" stroke-width="2"/>
    <polygon points="48,48 24,74 48,74" fill="#0F172A" stroke="#0F172A" stroke-width="2"/>
    <polygon points="48,48 48,74 72,74" fill="none" stroke="#0F172A" stroke-width="2"/>
    <text x="48" y="116" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#0F172A">(4)</text>
