<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 360" width="360" height="360">
  <rect width="360" height="360" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>
  <!-- Outer 4 corners (Top-left, Top-right, Bottom-left, Bottom-right squares) -->
  <!-- Top-left square [9, 5 / 7, U] -->
  <rect x="26" y="26" width="144" height="144" fill="none" stroke="#1E293B" stroke-width="2.5"/>
  <!-- Top-right square [7, 4 / ?, 5] -->
  <rect x="190" y="26" width="144" height="144" fill="none" stroke="#1E293B" stroke-width="2.5"/>
  <!-- Bottom-left square [2, E / 1, 2] -->
  <rect x="26" y="190" width="144" height="144" fill="none" stroke="#1E293B" stroke-width="2.5"/>
  <!-- Bottom-right square [!, 6 / 9, 3] -->
  <rect x="190" y="190" width="144" height="144" fill="none" stroke="#1E293B" stroke-width="2.5"/>
  <!-- Inner rounded overlapping frame tying U, ?, E, ! together -->
  <rect x="118" y="118" width="124" height="124" rx="22" fill="none" stroke="#1E293B" stroke-width="2"/>
  <rect x="166" y="166" width="14" height="14" fill="none" stroke="#1E293B" stroke-width="1.8"/>

  <!-- Top-left numbers & letter -->
  <text x="42" y="54" font-family="Georgia, serif" font-size="24" font-weight="700" fill="#0F172A">9</text>
  <text x="142" y="54" font-family="Georgia, serif" font-size="24" font-weight="700" fill="#0F172A">5</text>
  <text x="42" y="156" font-family="Georgia, serif" font-size="24" font-weight="700" fill="#0F172A">7</text>
  <text x="140" y="156" font-family="Georgia, serif" font-size="24" font-weight="700" fill="#0F172A">U</text>

  <!-- Top-right numbers & ? -->
  <text x="206" y="54" font-family="Georgia, serif" font-size="24" font-weight="700" fill="#0F172A">7</text>
  <text x="306" y="54" font-family="Georgia, serif" font-size="24" font-weight="700" fill="#0F172A">4</text>
  <text x="206" y="156" font-family="Georgia, serif" font-size="24" font-weight="700" fill="#2563EB">?</text>
  <text x="306" y="156" font-family="Georgia, serif" font-size="24" font-weight="700" fill="#0F172A">5</text>

  <!-- Bottom-left numbers & letter -->
  <text x="42" y="218" font-family="Georgia, serif" font-size="24" font-weight="700" fill="#0F172A">2</text>
  <text x="140" y="218" font-family="Georgia, serif" font-size="24" font-weight="700" fill="#0F172A">E</text>
  <text x="42" y="320" font-family="Georgia, serif" font-size="24" font-weight="700" fill="#0F172A">1</text>
  <text x="142" y="320" font-family="Georgia, serif" font-size="24" font-weight="700" fill="#0F172A">2</text>

  <!-- Bottom-right numbers & ! -->
  <text x="210" y="218" font-family="Georgia, serif" font-size="24" font-weight="700" fill="#2563EB">!</text>
  <text x="306" y="218" font-family="Georgia, serif" font-size="24" font-weight="700" fill="#0F172A">6</text>
  <text x="206" y="320" font-family="Georgia, serif" font-size="24" font-weight="700" fill="#0F172A">9</text>
  <text x="306" y="320" font-family="Georgia, serif" font-size="24" font-weight="700" fill="#0F172A">3</text>
</svg>
