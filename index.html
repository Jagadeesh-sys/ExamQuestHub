<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ExamQuestHub — Your Exam. Your Next Step.</title>
    <meta name="description" content="Verified government exam notifications, admit cards, results, daily current affairs, GK practice, and previous-year question papers for UPSC, SSC, Banking, Railways, AP, and TS." />
    <meta property="og:title" content="ExamQuestHub — Your Exam. Your Next Step." />
    <meta property="og:description" content="Verified government exam notifications, admit cards, results, daily current affairs, GK practice, and previous-year question papers." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/assets/aistudio/file_000000006a4881f4be54dc3e116f9bc0_65b76b0e.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="/assets/aistudio/file_000000006a4881f4be54dc3e116f9bc0_65b76b0e.png" />
    <link rel="icon" type="image/png" href="/assets/aistudio/file_000000006a4881f4be54dc3e116f9bc0_65b76b0e.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Sans+Telugu:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  </head>
  <body class="bg-[#F6F8FC] text-[#182B45] antialiased selection:bg-[#EAF3FF] selection:text-[#12345A]">
    <div id="root">
      <div id="eqh-initial-loader" style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background-color: #F6F8FC; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; padding: 20px; text-align: center;">
        <div style="width: 44px; height: 44px; border: 3.5px solid #E3EAF2; border-top-color: #12345A; border-radius: 50%; animation: eqh-spin 0.85s linear infinite; margin-bottom: 14px;"></div>
        <div style="font-size: 15px; font-weight: 700; color: #12345A; margin-bottom: 4px;">ExamQuestHub</div>
        <div style="font-size: 12px; color: #718096;">Loading verified notifications...</div>
        <div id="eqh-timeout-msg" style="display: none; margin-top: 14px;">
          <p style="font-size: 12px; color: #C64545; margin-bottom: 10px;">Taking longer than expected on your network connection.</p>
          <button onclick="window.location.reload()" style="background-color: #12345A; color: white; border: none; padding: 8px 18px; font-size: 12px; font-weight: bold; border-radius: 10px; cursor: pointer;">Reload Page</button>
        </div>
      </div>
      <style>
        @keyframes eqh-spin { to { transform: rotate(360deg); } }
      </style>
      <script>
        setTimeout(function() {
          var msg = document.getElementById('eqh-timeout-msg');
          if (msg && document.getElementById('eqh-initial-loader')) {
            msg.style.display = 'block';
          }
        }, 7000);
      </script>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
